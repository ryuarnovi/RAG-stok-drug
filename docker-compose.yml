version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kepo
      POSTGRES_USER: kepo
      POSTGRES_PASSWORD: kepo123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kepo"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/kepo
      DB_USER: kepo
      DB_PASSWORD: kepo123
      DB_POOL_SIZE: "10"
      AI_PROVIDER: GEMINI
      AI_GEMINI_API_KEY: YOUR_API_KEY
      AI_GEMINI_MODEL: gemini-2.0-flash
      REPORTS_OUTPUT_DIR: /reports
      SERVER_PORT: "8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - reports:/reports

  frontend:
    build:
      context: ./kepo-desktop
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  reports:
